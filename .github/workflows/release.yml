name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sjekk at taggen samsvarer med versjonen i manifestet
        run: |
          manifest_version=$(node -p "require('./src/manifest.json').version")
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Taggen ${GITHUB_REF_NAME} samsvarer ikke med manifest-versjonen v${manifest_version}" >&2
            exit 1
          fi

      - run: npm test

      - name: Pakk utvidelsen (zip, brukes i Chrome via «Load unpacked»)
        run: npx web-ext build -s src --artifacts-dir artifacts --filename "uubw-{version}.zip"

      - name: Signer utvidelsen hos AMO (Firefox)
        env:
          WEB_EXT_API_KEY: ${{ vars.MOZ_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZ_API_SECRET }}
        run: npx web-ext sign -s src --channel unlisted --artifacts-dir artifacts

      - name: Publiser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.xpi --title "$GITHUB_REF_NAME" --generate-notes
